version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: fraud-detection-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fraud_detection
      MYSQL_USER: fraud_user
      MYSQL_PASSWORD: fraud_password
    ports:
      - "3306:3306"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mysql_data:/var/lib/mysql
    networks:
      - fraud-detection-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Apache Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fraud-detection-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - fraud-detection-network

  # Apache Zookeeper (required by Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: fraud-detection-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - fraud-detection-network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-detection-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://fraud_user:fraud_password@mysql:3306/fraud_detection
      KAFKA_BROKER: kafka:29092
    ports:
      - "8000:8000"
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    networks:
      - fraud-detection-network

  # Streamlit Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-detection-dashboard
    depends_on:
      - mysql
      - api
    environment:
      DATABASE_URL: mysql+pymysql://fraud_user:fraud_password@mysql:3306/fraud_detection
    ports:
      - "8501:8501"
    command: streamlit run src/dashboard.py --server.port=8501 --server.address=0.0.0.0
    networks:
      - fraud-detection-network

  # Streaming Service
  streaming:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-detection-streaming
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:29092
      DATABASE_URL: mysql+pymysql://fraud_user:fraud_password@mysql:3306/fraud_detection
    command: python src/stream.py
    networks:
      - fraud-detection-network

networks:
  fraud-detection-network:
    driver: bridge

volumes:
  mysql_data:
